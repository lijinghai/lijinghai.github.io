<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>算个文科生吧 | Lijinghai</title>
  <meta name="description" content="算个文科生吧的个人主页入口。RabbitRobot 项目主页已迁移到 /RabbitRobot/。">
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fa;
      --text: #20242a;
      --muted: #66707d;
      --line: #dde2ea;
      --accent: #d66a2f;
      --panel: #ffffff;
      --shadow: 0 18px 44px rgba(24, 31, 42, .08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        linear-gradient(180deg, #fff 0%, var(--bg) 100%);
      font-family: Inter, "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif;
      line-height: 1.65;
    }

    main {
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 36px 18px;
    }

    .home {
      width: min(720px, 100%);
      padding: clamp(28px, 6vw, 48px);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 14px;
      color: var(--text);
      font-size: clamp(36px, 8vw, 64px);
      line-height: 1.08;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 17px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 9px 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--text);
      background: #fff;
      font-weight: 750;
      text-decoration: none;
    }

    a.primary {
      border-color: var(--accent);
      color: #fff;
      background: var(--accent);
    }

    a:hover {
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <main>
    <section class="home" aria-labelledby="page-title">
      <p class="eyebrow">Lijinghai</p>
      <h1 id="page-title">算个文科生吧</h1>
      <p>这里先作为个人主页入口保留。原来的 RabbitRobot 项目主页已经迁移到新的路径。</p>
      <div class="actions">
        <a class="primary" href="RabbitRobot/">RabbitRobot 项目主页</a>
        <a href="https://github.com/lijinghai" target="_blank" rel="noreferrer">GitHub</a>
      </div>
    </section>
  </main>
</body>
</html>
