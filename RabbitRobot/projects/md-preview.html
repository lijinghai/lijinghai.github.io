<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Markdown Preview | RabbitRobot</title>
  <meta name="description" content="RabbitRobot Markdown preview page for README snapshots.">
  <link rel="icon" type="image/png" href="../images/rabbitrobot/RabbitRobot_logo_icon.png">
  <link rel="stylesheet" href="project-detail.css">
  <style>
    body { background: #f8fafc; }
    .preview-hero {
      max-width: 980px;
      margin: 0 auto;
      padding: 34px 22px 18px;
    }
    .preview-hero h1 {
      margin-top: 4px;
      font-size: clamp(30px, 4vw, 46px);
    }
    .preview-path {
      margin: 12px 0 0;
      color: var(--muted);
      font-family: Consolas, "SFMono-Regular", monospace;
      font-size: 13px;
      overflow-wrap: anywhere;
    }
    .preview-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }
    .preview-shell {
      max-width: 980px;
      margin: 0 auto 42px;
      padding: 0 22px;
    }
    .markdown-body {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: clamp(18px, 4vw, 34px);
      color: #24292f;
      font-size: 16px;
      line-height: 1.72;
      overflow: hidden;
      box-shadow: 0 18px 42px rgba(15, 23, 42, .06);
    }
    .markdown-body > *:first-child { margin-top: 0; }
    .markdown-body > *:last-child { margin-bottom: 0; }
    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3,
    .markdown-body h4,
    .markdown-body h5,
    .markdown-body h6 {
      position: relative;
      margin: 26px 0 12px;
      color: #0f172a;
      line-height: 1.28;
      letter-spacing: 0;
    }
    .markdown-body h1 {
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
      font-size: 32px;
    }
    .markdown-body h2 {
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line);
      font-size: 25px;
    }
    .markdown-body h3 { font-size: 20px; }
    .markdown-body h4 { font-size: 17px; }
    .markdown-body p,
    .markdown-body ul,
    .markdown-body ol,
    .markdown-body blockquote,
    .markdown-body table,
    .markdown-body pre {
      margin: 0 0 16px;
    }
    .markdown-body ul,
    .markdown-body ol {
      padding-left: 24px;
    }
    .markdown-body li { margin: 5px 0; }
    .markdown-body a { color: #0969da; }
    .markdown-body .anchor {
      position: absolute;
      left: -20px;
      color: #94a3b8;
      opacity: 0;
      font-size: .78em;
      text-decoration: none;
      transition: opacity .16s ease;
    }
    .markdown-body h1:hover .anchor,
    .markdown-body h2:hover .anchor,
    .markdown-body h3:hover .anchor,
    .markdown-body h4:hover .anchor,
    .markdown-body h5:hover .anchor,
    .markdown-body h6:hover .anchor { opacity: 1; }
    .markdown-body code {
      padding: 2px 5px;
      border-radius: 5px;
      background: #f1f5f9;
      color: #0f172a;
      font-family: Consolas, "SFMono-Regular", monospace;
      font-size: .92em;
    }
    .markdown-body pre {
      overflow-x: auto;
      padding: 14px 16px;
      border-radius: 8px;
      background: #0f172a;
      color: #e2e8f0;
      line-height: 1.58;
    }
    .markdown-body pre code {
      display: block;
      padding: 0;
      background: transparent;
      color: inherit;
      white-space: pre;
    }
    .markdown-body blockquote {
      padding: 10px 16px;
      border-left: 4px solid var(--orange);
      border-radius: 0 8px 8px 0;
      background: #fff7ed;
      color: #7c2d12;
    }
    .markdown-body table {
      display: block;
      width: 100%;
      overflow-x: auto;
      border-collapse: collapse;
    }
    .markdown-body th,
    .markdown-body td {
      padding: 9px 11px;
      border: 1px solid #d0d7de;
      vertical-align: top;
    }
    .markdown-body th {
      background: #f6f8fa;
      font-weight: 800;
    }
    .markdown-body tr:nth-child(2n) td { background: #f8fafc; }
    .markdown-body img {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 10px auto;
      border-radius: 6px;
    }
    .markdown-body table img {
      min-width: min(280px, 70vw);
      max-height: 520px;
      object-fit: contain;
    }
    .markdown-body hr {
      height: 1px;
      margin: 24px 0;
      border: 0;
      background: var(--line);
    }
    .status-box {
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 18px;
      color: var(--muted);
    }
    .mermaid {
      background: #fff;
      color: #334155;
      border: 1px solid var(--line);
    }
    @media (max-width: 720px) {
      .markdown-body { font-size: 15px; }
      .markdown-body .anchor { display: none; }
      .markdown-body pre code {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
    }
  </style>
</head>
<body>
  <nav class="detail-nav" aria-label="Project navigation">
    <div class="nav-inner">
      <a class="brand" href="../index.html">
        <img src="../images/rabbitrobot/RabbitRobot_logo_icon.png" alt="RabbitRobot logo">
        <span>RabbitRobot</span>
      </a>
      <div class="nav-links">
        <a href="../index.html#projects">Project Matrix</a>
      </div>
    </div>
  </nav>

  <header class="preview-hero">
    <p class="kicker">Markdown Preview</p>
    <h1 id="doc-title">README Preview</h1>
    <p id="doc-path" class="preview-path"></p>
    <div class="preview-actions">
      <button class="button primary" type="button" onclick="history.length > 1 ? history.back() : location.href='../index.html#projects'">Back</button>
      <a class="button" href="../index.html#projects">Project Matrix</a>
    </div>
  </header>

  <main>
    <div class="preview-shell">
      <article id="markdown" class="markdown-body">
        <div class="status-box">Loading Markdown preview...</div>
      </article>
    </div>
  </main>

  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const sourcePath = params.get("src") || params.get("file") || "";
      const titleNode = document.getElementById("doc-title");
      const pathNode = document.getElementById("doc-path");
      const markdownNode = document.getElementById("markdown");
      const headingIds = new Map();

      const allowedReadme = /^readmes\/[^?#]+\.md$/i;
      if (!allowedReadme.test(sourcePath) || sourcePath.includes("..")) {
        showError("Missing or unsupported Markdown file.");
        return;
      }

      const markdownUrl = new URL(sourcePath, location.href);
      pathNode.textContent = sourcePath;

      fetch(markdownUrl.href)
        .then((response) => {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.text();
        })
        .then((markdown) => {
          const title = findTitle(markdown) || sourcePath.split("/").pop();
          titleNode.textContent = title;
          document.title = `${title} | Markdown Preview`;
          markdownNode.innerHTML = renderMarkdown(markdown, markdownUrl);
          renderMermaid();
        })
        .catch((error) => {
          showError(`Markdown preview failed to load: ${error.message}`);
        });

      function showError(message) {
        titleNode.textContent = "Markdown Preview";
        pathNode.textContent = sourcePath || "No file selected";
        markdownNode.innerHTML = `<div class="status-box">${escapeHtml(message)}</div>`;
      }

      function findTitle(markdown) {
        const match = markdown.replace(/\r\n?/g, "\n").match(/^\s*#\s+(.+)$/m);
        return match ? stripInlineMarkdown(match[1]).trim() : "";
      }

      function renderMarkdown(markdown, baseUrl) {
        const lines = markdown.replace(/\r\n?/g, "\n").split("\n");
        const html = [];
        let paragraph = [];
        let index = 0;

        const flushParagraph = () => {
          if (!paragraph.length) return;
          html.push(`<p>${inlineFormat(paragraph.join(" "), baseUrl)}</p>`);
          paragraph = [];
        };

        while (index < lines.length) {
          const line = lines[index];
          const trimmed = line.trim();

          if (!trimmed) {
            flushParagraph();
            index += 1;
            continue;
          }

          const fence = trimmed.match(/^```([\w-]*)/);
          if (fence) {
            flushParagraph();
            const lang = fence[1] || "";
            const code = [];
            index += 1;
            while (index < lines.length && !lines[index].trim().startsWith("```")) {
              code.push(lines[index]);
              index += 1;
            }
            index += 1;
            if (lang.toLowerCase() === "mermaid") {
              html.push(`<pre class="mermaid">${escapeHtml(code.join("\n"))}</pre>`);
            } else {
              html.push(`<pre><code class="language-${escapeAttr(lang)}">${escapeHtml(code.join("\n"))}</code></pre>`);
            }
            continue;
          }

          if (isTableStart(lines, index)) {
            flushParagraph();
            const table = collectTable(lines, index, baseUrl);
            html.push(table.html);
            index = table.nextIndex;
            continue;
          }

          const heading = line.match(/^\s{0,3}(#{1,6})\s+(.+)$/);
          if (heading) {
            flushParagraph();
            const level = heading[1].length;
            const rawText = heading[2].replace(/\s+#+\s*$/, "");
            const id = uniqueHeadingId(rawText);
            html.push(`<h${level} id="${id}"><a class="anchor" href="#${id}" aria-label="Link to heading">¶</a>${inlineFormat(rawText, baseUrl)}</h${level}>`);
            index += 1;
            continue;
          }

          if (/^ {0,3}([-*_])(?:\s*\1){2,}\s*$/.test(trimmed)) {
            flushParagraph();
            html.push("<hr>");
            index += 1;
            continue;
          }

          if (/^\s{0,3}>\s?/.test(line)) {
            flushParagraph();
            const quote = [];
            while (index < lines.length && /^\s{0,3}>\s?/.test(lines[index])) {
              quote.push(lines[index].replace(/^\s{0,3}>\s?/, ""));
              index += 1;
            }
            html.push(`<blockquote>${renderMarkdown(quote.join("\n"), baseUrl)}</blockquote>`);
            continue;
          }

          const unordered = line.match(/^\s{0,3}[-*+]\s+(.+)$/);
          const ordered = line.match(/^\s{0,3}\d+[.)]\s+(.+)$/);
          if (unordered || ordered) {
            flushParagraph();
            const orderedList = Boolean(ordered);
            const tag = orderedList ? "ol" : "ul";
            const items = [];
            while (index < lines.length) {
              const listMatch = orderedList
                ? lines[index].match(/^\s{0,3}\d+[.)]\s+(.+)$/)
                : lines[index].match(/^\s{0,3}[-*+]\s+(.+)$/);
              if (!listMatch) break;
              items.push(`<li>${inlineFormat(listMatch[1], baseUrl)}</li>`);
              index += 1;
            }
            html.push(`<${tag}>${items.join("")}</${tag}>`);
            continue;
          }

          paragraph.push(trimmed);
          index += 1;
        }

        flushParagraph();
        return html.join("\n");
      }

      function isTableStart(lines, index) {
        return lines[index] && lines[index].includes("|") && lines[index + 1] && isTableSeparator(lines[index + 1]);
      }

      function isTableSeparator(line) {
        return /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(line);
      }

      function collectTable(lines, startIndex, baseUrl) {
        const rows = [];
        let index = startIndex;
        while (index < lines.length && lines[index].trim() && lines[index].includes("|")) {
          rows.push(splitTableRow(lines[index]));
          index += 1;
        }
        const headers = rows[0] || [];
        const body = rows.slice(2);
        const headHtml = headers.map((cell) => `<th>${inlineFormat(cell, baseUrl)}</th>`).join("");
        const bodyHtml = body.map((row) => {
          const cells = row.map((cell) => `<td>${inlineFormat(cell, baseUrl)}</td>`).join("");
          return `<tr>${cells}</tr>`;
        }).join("");
        return {
          html: `<table><thead><tr>${headHtml}</tr></thead><tbody>${bodyHtml}</tbody></table>`,
          nextIndex: index
        };
      }

      function splitTableRow(row) {
        return row.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((cell) => cell.trim());
      }

      function inlineFormat(raw, baseUrl) {
        const stash = [];
        const token = (html) => {
          const key = `\u0000MDTOKEN${stash.length}\u0000`;
          stash.push(html);
          return key;
        };

        let text = raw
          .replace(/<img\s+([^>]*?)\/?>/gi, (match, attrs) => {
            const img = parseImageAttrs(attrs, baseUrl);
            return img ? token(img) : match;
          })
          .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (match, alt, href) => {
            const url = resolveAssetUrl(cleanMarkdownUrl(href), baseUrl);
            return token(`<img src="${escapeAttr(url)}" alt="${escapeAttr(stripInlineMarkdown(alt))}" loading="lazy">`);
          })
          .replace(/\[([^\]]+)\]\(([^)]+)\)/g, (match, label, href) => {
            const url = resolveLinkUrl(cleanMarkdownUrl(href), baseUrl);
            return token(`<a href="${escapeAttr(url)}"${isExternal(url) ? ' target="_blank" rel="noreferrer"' : ""}>${inlineFormat(label, baseUrl)}</a>`);
          })
          .replace(/`([^`]+)`/g, (match, code) => token(`<code>${escapeHtml(code)}</code>`));

        text = escapeHtml(text)
          .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
          .replace(/__([^_]+)__/g, "<strong>$1</strong>")
          .replace(/\*([^*]+)\*/g, "<em>$1</em>")
          .replace(/~~([^~]+)~~/g, "<del>$1</del>");

        return text.replace(/\u0000MDTOKEN(\d+)\u0000/g, (match, id) => stash[Number(id)] || "");
      }

      function parseImageAttrs(attrs, baseUrl) {
        const src = attrs.match(/\bsrc\s*=\s*["']([^"']+)["']/i);
        if (!src) return "";
        const alt = attrs.match(/\balt\s*=\s*["']([^"']*)["']/i);
        const width = attrs.match(/\bwidth\s*=\s*["']?([0-9%]+)["']?/i);
        const height = attrs.match(/\bheight\s*=\s*["']?([0-9%]+)["']?/i);
        const sizeAttrs = [
          width ? ` width="${escapeAttr(width[1])}"` : "",
          height ? ` height="${escapeAttr(height[1])}"` : ""
        ].join("");
        return `<img src="${escapeAttr(resolveAssetUrl(src[1], baseUrl))}" alt="${escapeAttr(alt ? alt[1] : "")}" loading="lazy"${sizeAttrs}>`;
      }

      function cleanMarkdownUrl(url) {
        const trimmed = url.trim();
        if (trimmed.startsWith("<") && trimmed.endsWith(">")) return trimmed.slice(1, -1).trim();
        return trimmed.replace(/\s+["'][^"']+["']\s*$/, "");
      }

      function resolveAssetUrl(url, baseUrl) {
        if (/^(https?:|mailto:|#)/i.test(url)) return url;
        return new URL(url, baseUrl).href;
      }

      function resolveLinkUrl(url, baseUrl) {
        if (/^(https?:|mailto:|#)/i.test(url)) return url;
        const target = new URL(url, baseUrl);
        if (/\.md$/i.test(target.pathname)) {
          const previewDir = new URL(".", location.href);
          const decodedDir = decodeURIComponent(previewDir.pathname);
          const decodedPath = decodeURIComponent(target.pathname);
          if (decodedPath.startsWith(decodedDir)) {
            const src = decodedPath.slice(decodedDir.length);
            return `md-preview.html?src=${encodeURIComponent(src)}`;
          }
        }
        return target.href;
      }

      function uniqueHeadingId(text) {
        const base = stripInlineMarkdown(text)
          .toLowerCase()
          .trim()
          .replace(/[^\p{L}\p{N}\s-]/gu, "")
          .replace(/\s+/g, "-")
          .replace(/-+/g, "-") || "section";
        const count = headingIds.get(base) || 0;
        headingIds.set(base, count + 1);
        return count ? `${base}-${count + 1}` : base;
      }

      function stripInlineMarkdown(text) {
        return text
          .replace(/!\[([^\]]*)\]\([^)]+\)/g, "$1")
          .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1")
          .replace(/(^|[\s(])_([^_\n]+)_($|[\s).,;:!?，。；：！？])/g, "$1$2$3")
          .replace(/[`*~#]/g, "");
      }

      function isExternal(url) {
        return /^https?:\/\//i.test(url) && !url.startsWith(location.origin);
      }

      async function renderMermaid() {
        const nodes = document.querySelectorAll(".mermaid");
        if (!nodes.length) return;
        try {
          const mermaidModule = await import("https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs");
          mermaidModule.default.initialize({ startOnLoad: false, securityLevel: "strict", theme: "neutral" });
          await mermaidModule.default.run({ nodes });
        } catch (error) {
          nodes.forEach((node) => node.classList.add("mermaid-unavailable"));
        }
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function escapeAttr(value) {
        return escapeHtml(value).replace(/`/g, "&#96;");
      }
    })();
  </script>
</body>
</html>
