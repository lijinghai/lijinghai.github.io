<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found | RabbitRobot</title>
  <script>
    (() => {
      const match = location.pathname.match(/^\/(?:(RabbitRobot)\/)?projects\/readmes\/([^/]+\.md)$/i);
      if (!match) return;
      const projectRoot = match[1] ? "/RabbitRobot/projects/" : "/projects/";
      const source = `readmes/${match[2]}`;
      location.replace(`${projectRoot}md-preview.html?src=${encodeURIComponent(source)}${location.hash}`);
    })();
  </script>
  <style>
    body {
      margin: 0;
      display: grid;
      min-height: 100vh;
      place-items: center;
      color: #23272f;
      background: #f5f6f8;
      font-family: Inter, "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif;
      text-align: center;
    }

    main {
      width: min(520px, calc(100vw - 36px));
      padding: 38px;
      border: 1px solid #dde2ea;
      border-radius: 8px;
      background: #fff;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 36px;
    }

    p {
      margin: 0 0 22px;
      color: #5f6875;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 8px 16px;
      color: #fff;
      background: #23272f;
      border-radius: 999px;
      font-weight: 750;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>这个页面不存在。RabbitRobot 主页只保留根地址入口。</p>
    <a href="/">返回 RabbitRobot 首页</a>
  </main>
</body>
</html>
